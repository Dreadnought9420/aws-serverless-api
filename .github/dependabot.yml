version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /terraform
      - /modules/static_site
      - /modules/serverless_api
      - /modules/observability
      - /modules/cost_guardrails
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Provider bumps land in their own pull request, never mixed with a
    # functional change.
    open-pull-requests-limit: 4

# No pip ecosystem entry on purpose. src/api has no requirements.txt and no
# third-party dependencies (ADR-0006); pointing Dependabot at it produces a
# failing "no manifest found" job every month. Add it back the same day a real
# dependency does.
