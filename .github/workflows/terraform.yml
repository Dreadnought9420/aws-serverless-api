name: Terraform

# Plan on every pull request, apply only from main behind the protected
# `production` environment. Authentication is keyless: both jobs assume an IAM
# role through the GitHub OIDC provider created by the bootstrap stack.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "modules/**"
      - "src/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "modules/**"
      - "src/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two runs touch the same state at once. Applies are not cancelled
  # mid-flight; that is how you end up with orphaned resources.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Two guards:
    #   - Dependabot runs get a read-only token and cannot be granted
    #     id-token: write, so the OIDC step can never succeed there.
    #   - Before ./scripts/bootstrap.sh has been run there is no role to
    #     assume, so a fresh clone would fail red on every push.
    if: github.actor != 'dependabot[bot]' && vars.AWS_PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="repository_url=${{ github.server_url }}/${{ github.repository }}"
          terraform show -no-color tfplan > plan.txt

      - name: Summarise the plan
        run: |
          {
            echo '## Terraform plan'
            echo
            echo '```terraform'
            # Keep the summary readable; the full plan is in the job log.
            head -c 60000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = body.length > 60000
              ? body.slice(0, 60000) + '\n... truncated, see the job log ...'
              : body;
            const marker = '<!-- terraform-plan -->';
            const comment = `${marker}\n### Terraform plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${truncated}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: comment });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: comment });
            }

      # The binary plan is the artifact the apply job consumes. A plan can
      # reference resource names and ARNs, so retention is short.
      - name: Upload the plan
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Protect this environment with required reviewers in
    # Settings -> Environments. The apply role's trust policy only accepts a
    # token whose `sub` names this environment, so approval is enforced by IAM
    # and not just by GitHub.
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # Apply the saved plan, never a freshly computed one. Re-planning here
      # would apply something nobody reviewed.
      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Publish the outputs
        run: |
          {
            echo '## Deployed'
            echo
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| Site | $(terraform output -raw site_url) |"
            echo "| Health | $(terraform output -raw api_health_url) |"
            echo "| Dashboard | $(terraform output -raw dashboard_url) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw cloudfront_distribution_id)" \
            --paths '/*' >/dev/null
