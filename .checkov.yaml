# Checkov configuration.
# Every skipped check MUST have a justification recorded in docs/security.md.
directory:
  - .
framework:
  - terraform
quiet: true
compact: true
download-external-modules: false
skip-check:
  # CKV_AWS_86  - CloudFront access logging. Deliberately deferred: standard
  #               logging v1 requires S3 ACLs (incompatible with the
  #               BucketOwnerEnforced ownership we enforce) and v2 adds
  #               recurring CloudWatch ingestion cost. See docs/security.md.
  - CKV_AWS_86
  # CKV_AWS_68  - WAF on CloudFront. Out of scope / cost-prohibitive for a
  #               personal project ($5/mo per Web ACL). See docs/security.md.
  - CKV_AWS_68
  # CKV2_AWS_47 - WAF Log4j rule group, same reason as CKV_AWS_68.
  - CKV2_AWS_47
  # CKV_AWS_144 - S3 cross-region replication. Single-region by design.
  - CKV_AWS_144
  # CKV_AWS_18  - S3 access logging on the site bucket. All reads go through
  #               CloudFront; the bucket is not directly reachable.
  - CKV_AWS_18
  # CKV_AWS_117 - Lambda in a VPC. The function only calls AWS APIs over the
  #               public endpoints; a VPC would add NAT/endpoint cost with no
  #               security gain here.
  - CKV_AWS_117
  # CKV_AWS_173 - Lambda env var KMS CMK. Env vars hold no secrets (table name
  #               and log level only); AWS-managed encryption is sufficient.
  - CKV_AWS_173
  # CKV_AWS_272 - Lambda code signing. Requires a Signer profile; deferred.
  - CKV_AWS_272
  # CKV_AWS_26  - SNS topic encryption. CloudWatch cannot publish to a topic
  #               encrypted with the AWS-managed alias/aws/sns key, so this
  #               needs a CMK (~USD 1/month) to encrypt "an alarm changed
  #               state". The sns_kms_key_id variable is there when it matters.
  - CKV_AWS_26
  # CKV_AWS_158 - CloudWatch Logs KMS CMK. Same cost trade-off; logs are
  #               already encrypted with an AWS-managed key at rest.
  - CKV_AWS_158
  # CKV_AWS_338 - One-year log retention. Deliberately 14 days: ingest and
  #               storage are the main CloudWatch cost driver here, and this is
  #               not a system with a compliance retention requirement.
  - CKV_AWS_338
  # CKV_AWS_119 - DynamoDB CMK. The table holds short public strings; the
  #               AWS-owned key is sufficient and free.
  - CKV_AWS_119
  # CKV2_AWS_62 - S3 event notifications. Nothing consumes bucket events.
  - CKV2_AWS_62
  # CKV_AWS_310 - CloudFront origin failover. A second origin group would need
  #               a second, replicated bucket; single-region by design.
  - CKV_AWS_310
  # CKV_AWS_374 - CloudFront geo restriction. The site is meant to be reachable
  #               from anywhere.
  - CKV_AWS_374
  # --- Confirmed by a real CI run, not guessed. See docs/security.md. ---
  # CKV_AWS_109 - "IAM policies without constraints" on the apply role. The
  #               statement IS constrained to role/<project>-* and the same
  #               document carries an explicit Deny on both CI roles; Checkov's
  #               heuristic does not read Deny statements as constraints.
  #               iam:CreateServiceLinkedRole genuinely requires Resource "*".
  - CKV_AWS_109
  # CKV_AWS_116 - Lambda dead letter queue. A DLQ only receives events from
  #               ASYNCHRONOUS invocation. This function is invoked
  #               synchronously by API Gateway, so a failure returns a 5xx to
  #               the caller and trips the api-5xx alarm. A DLQ here would
  #               never receive anything.
  - CKV_AWS_116
  # CKV_AWS_309 - API Gateway v2 route authorization. The API is deliberately
  #               public; it is throttled, concurrency-capped, length-validated
  #               and TTL-pruned instead.
  - CKV_AWS_309
  # CKV_AWS_174 - CloudFront viewer certificate TLS >= 1.2, and
  # CKV2_AWS_42 - CloudFront custom SSL certificate. Same root cause: the
  #               default *.cloudfront.net certificate is not a custom cert and
  #               pins its own minimum protocol version. Fixing both needs an
  #               owned domain plus ACM in us-east-1, which would make this repo
  #               undeployable from a clean fork. See ADR-0008.
  - CKV_AWS_174
  - CKV2_AWS_42
  # CKV_AWS_145 - S3 default encryption with KMS on the site bucket. SSE-KMS
  #               behind CloudFront OAC needs a key policy granting the
  #               CloudFront service principal kms:Decrypt, and bills a KMS
  #               request on every cache miss. The state bucket, where it
  #               matters, does use SSE-KMS.
  - CKV_AWS_145
